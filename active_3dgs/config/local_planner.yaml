fixed_frame: "world"
# Fill the odom frame as the sensor frame of the robot to fetch static tf when using robots
sensor_frame: "husky/lidar_points"
body_frame: "ground_truth/husky/base"
use_sim: false
use_odom_msg: false

#load wp
load_wp_from_json: false
wp_json_path: ""

# Set the gs_sim flag to switch between odom_frame_id in sim and robot
odom_frame_id: "husky/base"
world_frame_id: "world"
robot_odom_frame_id: "base_link"
robot_world_frame_id: "world"
gs_sim: false

height_filter: 0.2
gs_map_type: "filtered" # full, filtered, debug, none
subsample: 200

# Gaussian frontier param
ftr_cluster_size: 2.5
nms_radius: 1.5
filter_grad_mean : False

# Full is the full map, filtered is the map with height filter applied, debug is filtered portion

# Local planner params
v_max: 0.9
a_max: 0.3
yaw_max: 0.9
num_discretization: 1
dt: 1.0
plan_t_max: 0.3
use_3d: false
verbose: true
use_car: true
# Keep this smaller than planning_horizon so local goals require a trajectory.
goal_tolerance: 0.5
yaw_tolerance: 0.5
collision_tol: 0
robot_size: 1.2
plan_rate: 3.0
map_rate: 1.0
planning_horizon: 3
pub_collision_map: true
crop_goal_along_path: false

# Topo tree planner params
ftr_goal_tol: 2.0
fail_pose_tol: 0.20
fail_yaw_tol: 0.02

# language features
use_language_features: true
ipca_path: ''

# global planner params
global_grid_size: 100 # m
global_grid_resolution: 5 # m
region_relevancy_threshold: 0 # m
object_relevancy_threshold: 0 # m

tracker/mp_tracker_server: /jackal_tracker/mp_tracker_server
tracker/vel/kp: 0.1
tracker/vel/ki: 0.0
tracker/vel/kd: 0.0
tracker/vel/max_i: 1.0
tracker/vel/max_v: 1.0
tracker/yaw/kp: 1.0
tracker/yaw/ki: 0.0
tracker/yaw/kd: 0.0
tracker/yaw/max_i: 1.5
tracker/yaw/max_w: 1.57
reverse_with_cmd_queue: true
cmd_queue_size: 30
